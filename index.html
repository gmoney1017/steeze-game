</head><body>
<title>Steeze</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Chivo:ital,wght@0,400;0,600;0,800;1,800&family=Chivo+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D park. In-game HUD hugs the corners like a filmer's overlay.
   Menus are controller-first: a slanted curb-paint focus bar runs down a left list,
   tabs sit across the top with shoulder-button glyphs, detail panel on the right. */
:root {
  --asphalt: #111315;
  --slab: rgba(17, 19, 21, 0.86);
  --grip: #2b2e33;
  --grip2: #3a3e44;
  --chalk: #f2efe6;
  --dust: #a9a69c;
  --curb: #f5c518;
  --cobalt: #2a4bd7;
  --bail: #e5483b;
  --ok: #57c27a;
  --xa: #5fb04b; --xb: #d9433b; --xx: #3f78d9; --xy: #e6b627;
  --pscross: #7e9ce8; --pscircle: #e8656b; --pssquare: #d77fc7; --pstri: #4fc3a1;
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --ui: "Chivo", "Segoe UI", system-ui, sans-serif;
  --mono: "Chivo Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--asphalt); color: var(--chalk); font-family: var(--ui); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; outline: none; }
body.nav-pad, body.nav-pad * { cursor: none !important; }

/* ---------- button glyphs ---------- */
.g { display: inline-grid; place-items: center; min-width: 1.55em; height: 1.55em; padding: 0 .3em; box-sizing: border-box; border-radius: 999px; font: 800 .72em/1 var(--ui); color: #fff; vertical-align: -0.38em; text-shadow: none; letter-spacing: 0; }
.g.face { width: 1.55em; padding: 0; border-radius: 50%; }
.g.xa { background: var(--xa); } .g.xb { background: var(--xb); } .g.xx { background: var(--xx); } .g.xy { background: var(--xy); color: #1b1b1b; }
.g.ps { background: #1e2126; box-shadow: inset 0 0 0 1.5px currentColor; font-size: .8em; }
.g.ps.a { color: var(--pscross); } .g.ps.b { color: var(--pscircle); } .g.ps.x { color: var(--pssquare); } .g.ps.y { color: var(--pstri); }
.g.sh { background: #e9e6dd; color: #17191c; border-radius: 4px; font-size: .62em; padding: 0 .45em; height: 1.75em; }
.g.trig { background: #e9e6dd; color: #17191c; border-radius: 4px 4px 9px 9px; font-size: .62em; padding: 0 .45em; height: 1.75em; }
.g.stick { background: #2b2e33; box-shadow: inset 0 0 0 2px #e9e6dd; color: #e9e6dd; width: 1.55em; padding: 0; border-radius: 50%; font-size: .66em; }
.g.dpad { background: #e9e6dd; color: #17191c; border-radius: 3px; font-size: .62em; }
.g.sys { background: #2b2e33; color: #e9e6dd; box-shadow: inset 0 0 0 1.5px #e9e6dd; font-size: .6em; padding: 0 .5em; }
.g.key { background: #e9e6dd; color: #17191c; border-radius: 4px; font: 700 .66em/1 var(--mono); padding: 0 .45em; box-shadow: 0 2px 0 #9b978c; }

/* ---------- HUD ---------- */
.hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.hud > * { position: absolute; }
#tl { top: calc(16px + env(safe-area-inset-top, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: auto auto auto; align-items: baseline; column-gap: 14px; }
#tl .mark { font-family: var(--display); font-size: 20px; letter-spacing: .02em; line-height: 1; }
#tl .mark span { color: var(--curb); }
#tl .stat { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--dust); font-variant-numeric: tabular-nums; }
#tl .stat b { font-size: 14px; margin-left: 4px; }
#tl #fps { grid-column: 1 / -1; }
#tl .stat b { color: var(--chalk); font-weight: 700; }
#fps { font-family: var(--mono); font-size: 11px; color: var(--dust); }
#tr { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: grid; justify-items: end; gap: 4px; }
#stick { width: 64px; height: 64px; opacity: .85; }
#tr .lbl { display: none; }
#bl { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 8px; max-width: min(460px, 70vw); }
#feed { display: grid; gap: 1px; font-weight: 800; font-style: italic; font-size: 15px; letter-spacing: .01em; }
#feed div { animation: feedin .18s ease-out; }
#feed div.old { opacity: .5; font-weight: 600; font-size: 13px; }
#feed .pts { font-family: var(--mono); font-style: normal; color: var(--curb); margin-left: 8px; font-size: 12px; }
@keyframes feedin { from { transform: translateX(-10px); opacity: 0; } }
#linebox { display: flex; align-items: center; gap: 12px; transition: opacity .3s; }
#mult { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--cobalt); color: var(--chalk); font-family: var(--display); font-size: 19px; box-shadow: 0 0 0 3px rgba(242,239,230,.9), 0 0 20px rgba(42,75,215,.65); transition: transform .12s; }
#mult.bump { transform: scale(1.2); }
#lineval { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--chalk); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
#lineval small { display: block; color: var(--dust); font-size: 10px; letter-spacing: .18em; font-weight: 500; }
#linebox.dead { opacity: 0; }
#br { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 46vw; transition: opacity .6s; }
#br.quiet { opacity: 0; }
.chip { display: inline-flex; align-items: center; gap: 7px; background: rgba(17,19,21,.62); box-shadow: inset 0 0 0 1px rgba(242,239,230,.08); border-radius: 999px; padding: 4px 11px 4px 5px; font-size: 12px; font-weight: 600; color: var(--chalk); text-shadow: none; }
#callout { left: 0; right: 0; top: 22%; text-align: center; font-family: var(--display); font-size: clamp(22px, 4vw, 44px); line-height: 1.05; opacity: 0; transition: opacity .25s, transform .25s; text-wrap: balance; padding-inline: 16px; }
#callout.on { opacity: 1; transform: translateY(-6px); }
#callout .sub { display: block; font-family: var(--mono); font-size: clamp(13px, 1.5vw, 17px); color: var(--curb); margin-top: 6px; letter-spacing: .06em; }
#callout.bail { color: var(--bail); }
#balance { left: 50%; top: 63%; width: 230px; margin-left: -115px; height: 14px; }
#balance .track { position: absolute; inset: 5px 0; border-radius: 2px; background: linear-gradient(90deg, var(--bail) 0 13%, var(--curb) 13% 31%, rgba(242,239,230,.28) 31% 69%, var(--curb) 69% 87%, var(--bail) 87% 100%); }
#balance .needle { position: absolute; top: 0; width: 4px; height: 14px; margin-left: -2px; background: var(--chalk); border-radius: 2px; left: 50%; box-shadow: 0 0 6px rgba(0,0,0,.6); }
#balance .cap { position: absolute; top: 18px; left: -40px; right: -40px; text-align: center; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dust); }
#toast { top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translate(-50%, -90px); background: rgba(17,19,21,.86); box-shadow: inset 3px 0 0 var(--curb), 0 6px 24px rgba(0,0,0,.3); color: var(--chalk); padding: 10px 16px; border-radius: 8px; font-size: 13px; transition: transform .35s; text-shadow: none; white-space: nowrap; }
#toast.on { transform: translate(-50%, 0); }
#toast b { color: var(--curb); }
#hold { left: 50%; top: 72%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--slab); padding: 6px 12px 6px 6px; border-radius: 999px; text-shadow: none; }
#hold i { display: block; width: 70px; height: 4px; background: var(--grip2); border-radius: 2px; overflow: hidden; }
#hold i b { display: block; height: 100%; width: 0; background: var(--curb); }

/* ---------- replay ---------- */
#replay { position: fixed; left: 0; right: 0; bottom: 0; padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); background: linear-gradient(0deg, rgba(17,19,21,.9), rgba(17,19,21,0)); display: grid; gap: 10px; }
#replay .top { display: flex; align-items: center; gap: 12px; }
#replay .rec { font-family: var(--display); font-size: 18px; color: var(--chalk); }
#replay .rec::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bail); margin-right: 8px; vertical-align: 1px; }
#replay .tm { font-family: var(--mono); font-size: 13px; color: var(--dust); }
#rbar { height: 6px; background: var(--grip2); border-radius: 3px; position: relative; }
#rbar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--curb); border-radius: 3px; }
#replay .keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--chalk); }
#replay .keys span { display: inline-flex; align-items: center; gap: 6px; }
#letter { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 60px 0 #000, inset 0 -0px 0 #000; }

/* ---------- map ---------- */
#map { position: fixed; inset: 0; background: rgba(12,13,15,.9); display: grid; place-items: center; }
#map .box { display: grid; gap: 12px; justify-items: center; padding: 16px; }
#map canvas { width: min(78vh, 90vw); height: min(78vh, 90vw); border-radius: 6px; }
#map .cap { font-size: 12px; color: var(--dust); display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; }

/* ---------- menus ---------- */
.screen { position: fixed; inset: 0; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; background: linear-gradient(90deg, rgba(14,15,17,.95) 0%, rgba(14,15,17,.86) 46%, rgba(14,15,17,.35) 100%); }
.screen.solid { background: rgba(14,15,17,.97); }
.scr-head { padding-block: calc(26px + env(safe-area-inset-top, 0px)) 0; padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.scr-title { font-family: var(--display); font-size: clamp(34px, 5.4vw, 60px); line-height: .9; margin: 0; transform: skewX(-8deg); transform-origin: left bottom; letter-spacing: .005em; }
.scr-title .z { color: var(--curb); }
.tabs { display: flex; align-items: center; gap: 4px 18px; flex-wrap: wrap; }
.tab { background: none; border: 0; color: var(--dust); font: 800 15px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; padding: 8px 2px; border-bottom: 3px solid transparent; }
.tab.on { color: var(--chalk); border-bottom-color: var(--curb); }
.scr-body { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 32px; min-height: 0; padding-block: 18px 0; padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.list { display: grid; align-content: start; gap: 6px; overflow-y: auto; min-height: 0; padding: 4px 10px 24px 4px; scrollbar-width: thin; }
.sec { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--curb); font-weight: 800; margin: 14px 0 2px 2px; }
.sec:first-child { margin-top: 0; }
.item { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; min-height: 50px; padding: 0 18px; background: rgba(242,239,230,.055); box-shadow: inset 0 0 0 1px rgba(242,239,230,.06); border-radius: 6px; color: var(--chalk); border: 0; text-align: left; font: 600 15px/1.2 var(--ui); isolation: isolate; }
.item.focus { box-shadow: none; }
.item::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--curb); transform: skewX(-12deg) scaleX(0); transform-origin: left; transition: transform .14s ease-out; }
.item.focus { color: var(--asphalt); }
.item.focus::before { transform: skewX(-12deg) scaleX(1.015); }
.item.big { min-height: 64px; font: 400 26px/1 var(--display); letter-spacing: .01em; }
.item .val { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; white-space: nowrap; }
.item .val .ar { opacity: .55; font-size: 13px; }
.item.focus .val .ar { opacity: 1; }
.item .meter { width: 120px; height: 5px; background: rgba(242,239,230,.25); border-radius: 3px; position: relative; }
.item .meter b { position: absolute; inset: 0 auto 0 0; background: var(--cobalt); border-radius: 3px; }
.item.focus .meter { background: rgba(17,19,21,.25); }
.item.focus .meter b { background: var(--asphalt); }
.item .num { font-family: var(--mono); min-width: 2.4em; text-align: right; }
.item .pips { display: flex; gap: 4px; }
.item .pips i { width: 16px; height: 4px; background: rgba(242,239,230,.25); }
.item .pips i.on { background: var(--cobalt); }
.item.focus .pips i { background: rgba(17,19,21,.25); } .item.focus .pips i.on { background: var(--asphalt); }
.item.done .val { color: var(--ok); }
.item.focus.done .val { color: var(--asphalt); }
.item small { display: block; font-weight: 400; font-size: 12px; color: var(--dust); margin-top: 3px; }
.item.focus small { color: rgba(17,19,21,.75); }
#menu.closet { background: linear-gradient(90deg, rgba(14,15,17,.92) 0%, rgba(14,15,17,.8) 30%, rgba(14,15,17,0) 50%); }
#menu.closet .scr-body { grid-template-columns: minmax(300px, 460px) 1fr; }
#menu.closet .side { visibility: hidden; }
.item .sw { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(242,239,230,.7); }
.item.focus .sw { box-shadow: 0 0 0 2px rgba(17,19,21,.8); }
.item .cnt { font: 600 11px/1 var(--mono); opacity: .5; }
.side { min-width: 0; overflow-y: auto; padding-bottom: 24px; display: grid; align-content: start; gap: 16px; }
.side h3 { margin: 0; font-family: var(--display); font-size: 24px; letter-spacing: .01em; }
.side p { margin: 0; color: var(--dust); line-height: 1.55; max-width: 52ch; font-size: 15px; }
.scr-foot { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: flex-end; align-items: center; padding-block: 12px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); font-size: 14px; }
.scr-foot button { background: none; border: 0; color: var(--chalk); font: 600 14px var(--ui); display: inline-flex; align-items: center; gap: 8px; padding: 4px; }
.scr-foot .left { margin-right: auto; color: var(--dust); font-size: 12px; }
button:focus-visible { outline: 2px solid var(--curb); outline-offset: 2px; }
.paddiag { display: grid; gap: 14px; }
.pad-svg { width: 100%; max-width: 360px; height: auto; }
.pad-svg .body { fill: rgba(242,239,230,.06); stroke: var(--chalk); stroke-width: 2; }
.pad-svg .part { fill: none; stroke: var(--chalk); stroke-width: 1.6; }
.maplist { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 9px 18px; max-width: 640px; }
.mrow { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--chalk); min-width: 0; }
.mrow .g { flex: none; font-size: 15px; }
.kbd-list { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; color: var(--dust); align-items: center; }
.kbd-list dt { color: var(--chalk); display: flex; gap: 4px; flex-wrap: wrap; }
.kbd-list dd { margin: 0; }
.flicks { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; max-width: 620px; }
.flick { display: grid; gap: 4px; justify-items: center; text-align: center; background: rgba(43,46,51,.5); padding: 12px 6px; }
.flick canvas { width: 64px; height: 64px; }
.flick span { font-size: 13px; font-weight: 800; }
.flick em { font-style: normal; font-size: 11px; color: var(--dust); }
/* title */
#title .scr-head { padding-top: calc(8vh + env(safe-area-inset-top, 0px)); }
.studio { font-size: 11px; letter-spacing: .34em; text-transform: uppercase; color: var(--dust); }
.word { font-family: var(--display); font-size: clamp(72px, 13vw, 150px); line-height: .8; letter-spacing: -.01em; color: var(--chalk); transform: skewX(-8deg); transform-origin: left bottom; margin: 0; }
.word .z { color: var(--curb); }
#title .scr-body { grid-template-columns: minmax(0, 420px) minmax(0, 1fr); padding-top: 4vh; }
.press { font-family: var(--mono); font-size: 13px; color: var(--dust); letter-spacing: .08em; display: flex; align-items: center; gap: 8px; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .45; } }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--mono); color: var(--dust); font-size: 13px; letter-spacing: .1em; }
@media (max-width: 760px) {
  .scr-body, #title .scr-body { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .screen { background: rgba(14,15,17,.92); }
  #br { display: none; }
  #stick { width: 60px; height: 60px; }
}
/* phones: on-screen buttons (they press the same buttons a controller does) */
#touchui { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
#touchui .tb { pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; background: rgba(14,15,17,.55); color: var(--chalk); border: 1.5px solid rgba(239,235,225,.35); border-radius: 999px; font: 700 12px var(--ui); letter-spacing: .08em; min-width: 54px; height: 44px; padding: 0 14px; }
#touchui .tb.on { background: var(--curb); color: #111; border-color: var(--curb); }
#tbMenu { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); font-size: 20px !important; min-width: 48px !important; padding: 0 !important; }
#tbCol { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 38%; display: grid; gap: 10px; }
body.touch #tr { right: 76px; }
.netname { position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; font: 700 12px var(--ui); color: var(--chalk); background: rgba(14,15,17,.6); padding: 2px 8px; border-radius: 999px; white-space: nowrap; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; }
#online { color: #7fd18b; }
/* phones in portrait: the closet's list sits at the bottom so the skater shows above it */
@media (max-width: 760px) and (orientation: portrait) {
  #menu.closet { background: linear-gradient(0deg, rgba(14,15,17,.96) 0%, rgba(14,15,17,.9) 40%, rgba(14,15,17,0) 62%); grid-template-rows: auto 1fr auto; }
  #menu.closet .scr-body { align-items: end; padding-left: 12px; padding-right: 12px; }
  #menu.closet .list { max-height: 34vh; padding-bottom: 6px; }
  #menu.closet .scr-title { font-size: 26px; }
  .scr-foot { gap: 4px 12px; padding-left: 12px; padding-right: 12px; font-size: 13px; }
  .scr-foot button { font-size: 13px; padding: 8px 4px; }
}
/* console-style boot */
#boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #0b0c0e; color: var(--chalk); transition: opacity .6s ease, background .6s ease; }
#boot.ph-start { background: linear-gradient(0deg, rgba(10,11,13,.94) 0%, rgba(10,11,13,.3) 48%, rgba(10,11,13,.6) 100%); }
#boot.out { opacity: 0; pointer-events: none; }
.booting #title, .booting #hud, .booting #touchui { visibility: hidden; }
#bootStudio { display: grid; justify-items: center; gap: 18px; opacity: 0; }
#bootStudio .vmark { width: min(120px, 28vw); color: var(--chalk); }
#bootStudio .vname { font: 600 15px var(--ui); letter-spacing: .5em; padding-left: .5em; color: var(--chalk); }
#bootLoad, #bootStart { display: grid; justify-items: center; gap: 18px; padding: 0 16px; text-align: center; }
#boot [hidden] { display: none !important; }
#boot .b-word { font-family: var(--display); font-size: clamp(54px, 12vw, 96px); line-height: .9; transform: skewX(-9deg); text-shadow: 0 6px 0 rgba(0,0,0,.55); }
#boot .b-word span { color: var(--curb); }
#boot .b-word.big { font-size: clamp(70px, 17vw, 150px); }
#boot .b-bar { width: min(420px, 72vw); height: 8px; border-radius: 999px; background: rgba(239,235,225,.12); overflow: hidden; }
#boot .b-bar i { display: block; height: 100%; width: 0; background: var(--curb); border-radius: 999px; }
#boot .b-pct { font: 700 12px var(--mono); letter-spacing: .14em; color: var(--dust); margin-top: -8px; }

/* =========================================================================
   GAME LOOP
   ========================================================================= */
let clock = 0, acc = 0, last = performance.now();
// phone buttons show while skating (and on the map / replay, where MAP closes them)
let touchShown = null;
function touchUiTick() {
  const show = inp.mode === 'touch' && (mode === 'play' || mode === 'map' || mode === 'replay') && !curScreen();
  if (show !== touchShown) { touchShown = show; $('touchui').hidden = !show; if (!show) TOUCHB.clear(); }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!(window.__steeze && window.__steeze.hold)) tick(dt);
  if (window.__steeze && window.__steeze.camOverride) window.__steeze.camOverride(camera, P, skater);
  extPose(); try { netTick(dt); } catch (e) { } touchUiTick(); audio.musicTick(); if (BOOT.active && !BOOT.leaving && mode !== 'title' && mode !== 'menu') bootQuiet(); renderer.render(scene, camera);
  if (previewDue && now > previewDue && (mode === 'play' || mode === 'title')) { // remember what this spot looks like for the spot menu
    previewDue = 0;
    try { const c = document.createElement('canvas'); c.width = 384; c.height = 216; const g = c.getContext('2d'); const a = canvas.width / canvas.height, sw = a > 16 / 9 ? canvas.height * 16 / 9 : canvas.width, sh = sw * 9 / 16; g.drawImage(canvas, (canvas.width - sw) / 2, (canvas.height - sh) / 2, sw, sh, 0, 0, 384, 216); store.set('prev_' + curMap + '_' + S.tod, c.toDataURL('image/jpeg', 0.72)); } catch (e) { }
  }
}
function tick(dt) {
  pollInput(dt);
  if (window.__steeze && window.__steeze.override) window.__steeze.override(inp, pad);
  if (mode === 'play') gameTick(dt);
  else if (mode === 'menu' || mode === 'title') {
    if (BOOT.active) bootTick(dt); else menuInput(dt);
    clock += dt;
    if (CL.on) closetTick(dt);
    if (mode === 'title') { animate(dt, clock); stepCamera(dt, true); updateTOD(dt); }
    audio.update(true);
  } else if (mode === 'replay') { stepReplay(dt); audio.update(true); }
  else if (mode === 'map') {
    if (pad.down.has('B') || pad.up.has('View') || pad.down.has('Menu') || keyDown.has('Escape') || keyDown.has('Tab') || keyDown.has('Backspace')) setMode2('play'); // View closes on release, so the same press can't reopen it
    else mapInput(dt);
    audio.update(true);
  }
  updateBoardParts(dt);
  keyDown.clear();
}
function gameTick(dt) {
  clock += dt;
  if (pad.down.has('Menu') || keyDown.has('Escape') || keyDown.has('KeyP')) { openScreen(pauseScreen()); return; }
  const view = tapHold('View', 0.35);
  if (view === 'tap') { setMode2('map'); return; }
  if (view === 'hold') { openReplay(); return; }
  if (pad.cur.LB) { // LB + D-pad picks a gesture instead of the usual D-pad actions
    const gmap = { Up: 'wave', Right: 'point', Down: 'shrug', Left: 'pump' };
    for (const d in gmap) if (pad.down.has(d)) P.gesture = gmap[d];
    for (const d of ['Up', 'Down']) if (pad.cur[d]) { holdState[d] = holdState[d] || {}; holdState[d].fired = true; }
  }
  const lbEat = pad.cur.LB || pad.up.has('LB');
  const up = lbEat ? null : tapHold('Up', 0.6);
  if (up === 'tap') { if (P.marker && P.state !== 'bail') { loseLineQuiet(); respawn(P.marker); } else if (!P.marker) toast('No marker yet. Hold ' + glyph('Up') + ' while rolling to set one.'); }
  if (up === 'hold') { if (P.state === 'ground') setMarker(); else toast('Get on the ground to drop a marker'); }
  if (!lbEat && tapHold('Down', 0.8) === 'hold') { P.marker = null; loseLineQuiet(); respawn(SPAWN); toast('Back at the roll-in'); }
  if (pad.down.has('Left') && !lbEat) { const k = Object.keys(CAMS), i = k.indexOf(S.camPreset); setSetting('camPreset', k[(i + 1) % k.length]); toast('<b>Camera</b> ' + CAMS[S.camPreset].label); }
  if (pad.down.has('Right') && !lbEat) { setSetting('monitor', !S.monitor); }
  if (pad.down.has('Y')) {
    if (P.state === 'ground') getOff();
    else if (P.state === 'walk') { if (P.hasBoard) getOn(); else if (nearBoard(1.8)) stepOnBoard(); else if (!BOARD.fly) callBoard(); }
  }
  offBoardInput();
  const ev = flick.update(dt, inp.rx, inp.ry);
  if (ev && (P.state === 'ground' || P.state === 'grind')) doPop(ev);
  if (P.state === 'ground' && !P.manual && flick.manualT > 0.16 && P.s > 0.8) startManual(flick.manualSign);
  acc += dt;
  while (acc >= DT) {
    acc -= DT;
    if (P.state === 'ground') stepGround(DT);
    else if (P.state === 'air') stepAir(DT);
    else if (P.state === 'grind') stepGrind(DT);
    else if (P.state === 'plant') stepPlant(DT);
    else if (P.state === 'walk') stepWalk(DT);
    else if (P.state === 'trans') stepTrans(DT);
    else if (P.state === 'bail') stepBail(DT);
    stepBoard(DT);
  }
  stepLine(dt);
  animate(dt, clock);
  stepCamera(dt, false);
  updateTOD(dt);
  updateHud(dt);
  audio.update(false);
  recordFrame(clock);
}

function boot(saved) {
  makeRenderer();
  scene.add(world); initSky();
  sun = new THREE.DirectionalLight(0xfff1dc, 1.6); sun.position.set(20, 30, 10);
  sun.shadow.mapSize.set(1024, 1024); const sc = sun.shadow.camera; sc.left = sc.bottom = -8; sc.right = sc.top = 8; sc.near = 1; sc.far = 60;
  scene.add(sun); scene.add(sun.target);

  scene.add(skater);
  applyQuality();
  if (saved && typeof saved.total === 'number') total = saved.total;
  loadMap(S.map);
  $('loading').hidden = true;
  if (saved && saved.mode === 'play') setMode2('play'); else { openScreen(titleScreen()); bootStart(); } // logo -> loading -> press start, over the title scene
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); if (renderer) renderer.setSize(innerWidth, innerHeight, false); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') openScreen(pauseScreen()); });
window.claude?.hot?.snapshot?.(() => ({ total, mode: mode === 'play' ? 'play' : 'title' }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

// test hooks (harmless in production)
window.__steeze = {
  step(n, dt = 1 / 60) { for (let i = 0; i < n; i++) tick(dt); if (this.camOverride) this.camOverride(camera, P, skater); if (!this.norender) { extPose(); renderer.render(scene, camera); } },
  info() { return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; },
  get mode() { return mode; }, get total() { return total; }, get screen() { return curScreen() && curScreen().id; },
  padMode(style) { inp.padStyle = style || 'xbox'; setMode('kb'); setMode('pad'); },
  P, S, pad, inp, flick, rails, surfaces, line, rep, respawn, setMode2, openScreen, pauseScreen, settingsScreen, sampleGround, keyDown,
  groundTop,
  setQuality(q) { S.quality = q; applyQuality(); },
  replayBegin() { if (rep.frames.length < 2) return null; rep.live = snapTransforms(); rep.t0 = rep.frames[0].t; rep.t1 = rep.frames[rep.frames.length - 1].t; return [rep.t0, rep.t1]; },
  replaySeek(t) { const fr = frameAt(t); applyTransforms(fr.f); if (sun) { sun.position.copy(skater.position).addScaledVector(todSun, 30); sun.target.position.copy(skater.position); } return fr.p; },
  replayEnd() { if (rep.live) applyTransforms(rep.live); if (BOARD.attached) { leanG.add(boardRig); boardRig.position.set(0, 0, 0); boardRig.quaternion.identity(); } else placeBoardMesh(); },
  BOARD, poles, applyTOD, loadMap, setLook, LOOK, LOOK_OPTS, B, openCloset, closeCloset, CL, BOARD_PARTS, EXT, THREE_V: THREE.Vector3, MAPS, STYLES, get curMap() { return curMap; }, SPOTS, LAMPS, camera, world, bail, getOff, getOn, callBoard, dropBoard, pickUpBoard, nearBoard, probe, R, skater, boardRig, CT, carryRest, NET, CLIP, store, TOUCHB, audio, BOOT
};
onlineStart(); // multiplayer + account save, when the platform offers them
